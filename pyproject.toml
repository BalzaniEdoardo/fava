[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncvideo"
version = "0.1.0"
description = "Async video reader with fast random frame access."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kushal Kolar" },
    { name = "Edoardo Balzani" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "av",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "nox",
    "ruff",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["asyncvideo"]